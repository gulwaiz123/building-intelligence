[project]
name = "building-with-rag"
version = "0.1.0"
description = "Building with RAG classroom capstone (BNS/IPC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pymongo>=4.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/building_with_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["raw", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
